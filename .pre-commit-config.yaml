# Local pre-commit hook config. Install once with:
#
#     uv run pre-commit install
#
# Hooks then run on every `git commit`. Config (rules / per-file ignores /
# excluded paths) lives in pyproject.toml [tool.ruff] so pre-commit and
# CI use the exact same gate.
#
# CI re-runs the same ruff version in .gitlab-ci.yml — bypassing the
# pre-commit hook locally (e.g. `git commit --no-verify`) is fine because
# the merge-request pipeline still blocks unclean code.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
